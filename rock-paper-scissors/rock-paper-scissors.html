<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rock-paper-scissors.css">
</head>
<body>
    <div class="content">
        <div class="scores">
            <div id="player-score">
                Player Score - 0
            </div>
            <div id="computer-score">
                Computer Score - 0
            </div>
        </div>
        <div class="buttons">
            <button class="choice" value="rock">
                Rock
            </button>
            <button class="choice" value="paper">
                Paper
            </button>
            <button class="choice" value="scissors">
                Scissors
            </button>
        </div>

        <button class="submit" id="submit" type="submit">
            Submit
        </button>

        <div id="game-over">
            <h2></h2>
            <h1></h1>
        </div>
    </div>
    <script src="rock-paper-scissors.js"></script>
</body>
</html>
